<div class="list-header">
  <h1>Árbitros</h1>
  <a mat-raised-button color="primary" routerLink="/arbitros/nuevo">
    <mat-icon>add</mat-icon>
    Nuevo árbitro
  </a>
</div>

@if (loading()) {
  <mat-spinner diameter="40" />
} @else if (referees().length === 0) {
  <p class="empty-state">No hay árbitros registrados.</p>
} @else {
  <table mat-table [dataSource]="referees()" class="mat-elevation-z1">
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let referee">{{ referee.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Apellido</th>
      <td mat-cell *matCellDef="let referee">{{ referee.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="nationality">
      <th mat-header-cell *matHeaderCellDef>Nacionalidad</th>
      <td mat-cell *matCellDef="let referee">{{ referee.nationality }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let referee">
        <a mat-icon-button [routerLink]="['/arbitros', referee.id, 'editar']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="remove(referee)" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
