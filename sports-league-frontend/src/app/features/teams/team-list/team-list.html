<div class="list-header">
  <h1>Equipos</h1>
  <a mat-raised-button color="primary" routerLink="/equipos/nuevo">
    <mat-icon>add</mat-icon>
    Nuevo equipo
  </a>
</div>

@if (loading()) {
  <mat-spinner diameter="40" />
} @else if (teams().length === 0) {
  <p class="empty-state">No hay equipos registrados.</p>
} @else {
  <table mat-table [dataSource]="teams()" class="mat-elevation-z1">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let team">{{ team.name }}</td>
    </ng-container>

    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef>Ciudad</th>
      <td mat-cell *matCellDef="let team">{{ team.city }}</td>
    </ng-container>

    <ng-container matColumnDef="stadium">
      <th mat-header-cell *matHeaderCellDef>Estadio</th>
      <td mat-cell *matCellDef="let team">{{ team.stadium }}</td>
    </ng-container>

    <ng-container matColumnDef="foundedDate">
      <th mat-header-cell *matHeaderCellDef>Fecha de fundación</th>
      <td mat-cell *matCellDef="let team">{{ team.foundedDate | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let team">
        <a mat-icon-button [routerLink]="['/equipos', team.id, 'editar']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="remove(team)" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
