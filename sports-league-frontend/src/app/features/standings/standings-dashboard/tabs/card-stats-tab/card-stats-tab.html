@if (rows().length === 0) {
  <p class="empty-state">No hay tarjetas registradas para este torneo.</p>
} @else {
  <table mat-table [dataSource]="rows()" class="mat-elevation-z1">
    <ng-container matColumnDef="playerName">
      <th mat-header-cell *matHeaderCellDef>Jugador</th>
      <td mat-cell *matCellDef="let row">{{ row.playerName }}</td>
    </ng-container>

    <ng-container matColumnDef="teamName">
      <th mat-header-cell *matHeaderCellDef>Equipo</th>
      <td mat-cell *matCellDef="let row">{{ row.teamName }}</td>
    </ng-container>

    <ng-container matColumnDef="yellowCards">
      <th mat-header-cell *matHeaderCellDef>Amarillas</th>
      <td mat-cell *matCellDef="let row">{{ row.yellowCards }}</td>
    </ng-container>

    <ng-container matColumnDef="redCards">
      <th mat-header-cell *matHeaderCellDef>Rojas</th>
      <td mat-cell *matCellDef="let row">{{ row.redCards }}</td>
    </ng-container>

    <ng-container matColumnDef="totalCards">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let row">{{ row.totalCards }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
