@if (rows().length === 0) {
  <p class="empty-state">No hay goleadores registrados para este torneo.</p>
} @else {
  <table mat-table [dataSource]="rows()" class="mat-elevation-z1">
    <ng-container matColumnDef="playerName">
      <th mat-header-cell *matHeaderCellDef>Jugador</th>
      <td mat-cell *matCellDef="let row">{{ row.playerName }}</td>
    </ng-container>

    <ng-container matColumnDef="teamName">
      <th mat-header-cell *matHeaderCellDef>Equipo</th>
      <td mat-cell *matCellDef="let row">{{ row.teamName }}</td>
    </ng-container>

    <ng-container matColumnDef="goals">
      <th mat-header-cell *matHeaderCellDef>Goles</th>
      <td mat-cell *matCellDef="let row">{{ row.goals }}</td>
    </ng-container>

    <ng-container matColumnDef="penalties">
      <th mat-header-cell *matHeaderCellDef>Penales</th>
      <td mat-cell *matCellDef="let row">{{ row.penalties }}</td>
    </ng-container>

    <ng-container matColumnDef="matchesWithGoals">
      <th mat-header-cell *matHeaderCellDef>Partidos con gol</th>
      <td mat-cell *matCellDef="let row">{{ row.matchesWithGoals }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
