@if (tournament(); as t) {
  <div class="detail-header">
    <div>
      <h1>{{ t.name }}</h1>
      <p>
        Temporada {{ t.season }} · {{ t.startDate | date: 'dd/MM/yyyy' }} - {{ t.endDate | date: 'dd/MM/yyyy' }}
        · Estado: {{ statusLabels[t.status] }} · {{ t.teamsCount }} equipo(s)
      </p>
    </div>
    <a mat-raised-button color="primary" [routerLink]="['/torneos', t.id, 'editar']">
      <mat-icon>edit</mat-icon>
      Editar
    </a>
  </div>

  <mat-tab-group>
    <mat-tab label="Equipos">
      <app-tournament-teams-tab [tournamentId]="t.id" />
    </mat-tab>
    <mat-tab label="Sponsors">
      <app-tournament-sponsors-tab [tournamentId]="t.id" />
    </mat-tab>
  </mat-tab-group>
}
